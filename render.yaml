services:
  - type: web
    name: lowlands-discord-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m league_bot.bot
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: LOWLANDS_SPREADSHEET_ID
        value: 15lCX6ljpsGh6bwzHZcctb24DIn-r4wqRGt6gZtLE_k4
      - key: LOG_LEVEL
        value: INFO
