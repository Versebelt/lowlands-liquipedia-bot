      INPUT_PLAYERS_JSON: '[{"player":"Ayli","discord":"Aylivado","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"Annabel","discord":"annabellsprout","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"GramenMystace","discord":"gramenmystace","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"Slam4","discord":"slam4","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"TheJellyMan","discord":"thejellyman.","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"koendew","discord":"koendew","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"Poezenmormel","discord":"Poezenmormel","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"Lua","discord":"pawlover","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"SanderFMC","discord":"sanderti_51912","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"BootyBread","discord":"booty_bread","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"Vitaleon","discord":"Donkerbruine Dakpan","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"rock","discord":"capybab","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"Rrick378","discord":"Rrick378","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"DatDaniel","discord":"datdaniel","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"I am fabulous","discord":"iamfabulous0371","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"daangast","discord":"daangast","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"YouriYolo","discord":"YouriYolo","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"Robijn","discord":"itsmerobinnn","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"Grategonalop","discord":"Grategonalop","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"Rob","discord":"confuse8894","missing":6,"missingChallenges":[1,2,3,4,5,6]},{"player":"IrisSophie","discord":"Pokkebaas","missing":2,"missingChallenges":[5,6]},{"player":"BliksemPiebe","discord":"Hartger","missing