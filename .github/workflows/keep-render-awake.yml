name: Keep Discord bot online

on:
  schedule:
    # Render Free sleeps after 15 minutes without inbound traffic.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-discord-bot-online
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Keep Render service awake and verify bot health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            https://lowlands-discord-bot.onrender.com/health)"
          printf '%s\n' "$response"
          python -c 'import json,sys; data=json.loads(sys.argv[1]); assert data.get("ok") is True, data' "$response"
