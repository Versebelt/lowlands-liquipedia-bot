name: Keep Discord bot online

on:
  schedule:
    # Render Free sleeps after 15 minutes without inbound traffic.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-discord-bot-online
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Keep Render service awake and verify bot health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            response="$(curl --fail-with-body --silent --show-error \
              --connect-timeout 15 \
              --max-time 30 \
              https://lowlands-discord-bot.onrender.com/health)" || true
            printf 'Attempt %s: %s\n' "$attempt" "$response"
            if python -c 'import json,sys; data=json.loads(sys.argv[1]); assert data.get("ok") is True, data' "$response"; then
              exit 0
            fi
            sleep 15
          done
          echo "Bot did not become Discord-ready after six attempts" >&2
          exit 1
