name: Recover Friday week 4 reminder
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-friday-week4.yml]
permissions:
  contents: read
concurrency:
  group: discord-seed-reminders
  cancel-in-progress: false
jobs:
  send:
    if: github.event.head_commit.message == 'Send missed Friday week 4 reminder once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_GENERIC_ROLE_ID: ${{ secrets.DISCORD_GENERIC_ROLE_ID }}
      LOWLANDS_PUBLIC_SHEET_URL: https://docs.google.com/spreadsheets/d/15lCX6ljpsGh6bwzHZcctb24DIn-r4wqRGt6gZtLE_k4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reminder dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Send Friday week 4 reminder
        run: python -m reminders.send --kind friday --week 4 --players-json '[]'
