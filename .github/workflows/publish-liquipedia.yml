name: Publish to Liquipedia
run-name: Liquipedia ${{ inputs.page_title }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      page_title:
        description: Exact Liquipedia page title
        required: true
        type: string
      content_b64:
        description: UTF-8 wikicode encoded as base64
        required: true
        type: string
      edit_summary:
        description: Liquipedia edit summary
        required: true
        type: string
      request_id:
        description: Correlation id used by the Google Sheet log
        required: true
        type: string
      allow_unmarked_existing:
        description: One-time adoption of an existing production page
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  # GitHub only keeps one pending run per concurrency group. A page-specific
  # group prevents a batch publish from cancelling its own earlier weeks.
  group: liquipedia-publisher-${{ inputs.page_title }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install publisher dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Stagger production requests
        env:
          INPUT_PAGE_TITLE: ${{ inputs.page_title }}
        run: |
          delay=0
          if [[ "$INPUT_PAGE_TITLE" =~ /Week\ ([0-9]+)$ ]]; then
            delay=$((BASH_REMATCH[1] * 25))
          fi
          echo "Waiting ${delay}s before publishing ${INPUT_PAGE_TITLE}"
          sleep "$delay"

      - name: Publish requested page
        env:
          LIQUIPEDIA_BOT_USERNAME: ${{ secrets.LIQUIPEDIA_BOT_USERNAME }}
          LIQUIPEDIA_BOT_PASSWORD: ${{ secrets.LIQUIPEDIA_BOT_PASSWORD }}
          LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}
          LIQUIPEDIA_ALLOWED_TITLES: User:DialloBOT/test|Lowlands League/Season 2|Lowlands League/Season 2/Week 1|Lowlands League/Season 2/Week 2|Lowlands League/Season 2/Week 3|Lowlands League/Season 2/Week 4|Lowlands League/Season 2/Week 5|Lowlands League/Season 2/Week 6|Lowlands League/Season 2/Week 7|Lowlands League/Season 2/Week 8|Lowlands League/Season 2/Week 9|Lowlands League/Season 2/Week 10
          INPUT_PAGE_TITLE: ${{ inputs.page_title }}
          INPUT_CONTENT_B64: ${{ inputs.content_b64 }}
          INPUT_EDIT_SUMMARY: ${{ inputs.edit_summary }}
          INPUT_ALLOW_UNMARKED_EXISTING: ${{ inputs.allow_unmarked_existing }}
        run: python publisher/publish.py

      - name: Upload publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquipedia-result-${{ inputs.request_id }}
          path: publish-result.json
          if-no-files-found: ignore
          retention-days: 14
