name: Discord seed reminders
run-name: Discord ${{ inputs.kind }} reminder — week ${{ inputs.week }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Reminder to send
        required: true
        type: choice
        options: [test, open, friday, sunday, recap]
      week:
        description: Lowlands League week number
        required: true
        type: string
      players_json:
        description: Incomplete players supplied by Google Sheets
        required: false
        default: "[]"
        type: string
      request_id:
        description: Apps Script request ID for logging
        required: true
        type: string
      dry_run:
        description: Resolve names and print without posting
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: discord-seed-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_GENERIC_ROLE_ID: ${{ secrets.DISCORD_GENERIC_ROLE_ID }}
      LOWLANDS_PUBLIC_SHEET_URL: https://docs.google.com/spreadsheets/d/15lCX6ljpsGh6bwzHZcctb24DIn-r4wqRGt6gZtLE_k4
      INPUT_PLAYERS_JSON: ${{ inputs.players_json }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reminder dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Send Discord reminder
        shell: bash
        run: |
          args=(--kind "${{ inputs.kind }}" --week "${{ inputs.week }}" --players-json "$INPUT_PLAYERS_JSON")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m reminders.send "${args[@]}"
